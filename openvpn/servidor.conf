# Configuración del servidor OpenVPN del laboratorio.
# 03-configurar-servidor.sh reemplaza los valores __ENTRE_GUIONES__ y la
# copia a /etc/openvpn/server/servidor.conf

# --- Transporte --------------------------------------------------------------
port __PUERTO_VPN__
proto udp
dev tun                 # interfaz de capa 3 (IP), se llamará tun0

# --- Direccionamiento del túnel ------------------------------------------------
topology subnet
server __RED_VPN__ __MASCARA_VPN__       # el servidor toma la .1, los clientes el resto

# Ruta que se instala en cada CLIENTE al conectarse: solo el tráfico hacia la
# VPC entra al túnel (split tunnel). El resto de su navegación sigue igual.
push "route __RED_VPC__ __MASCARA_VPC__"

# --- Certificados (rutas relativas a /etc/openvpn/server) ----------------------
ca ca.crt
cert servidor.crt
key servidor.key
dh none                 # sin parámetros DH clásicos: se usa ECDHE
tls-crypt ta.key
# crl-verify crl.pem    # se activa con 05-revocar-cliente.sh

# --- Criptografía --------------------------------------------------------------
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

# --- Mantenimiento de la conexión ------------------------------------------------
keepalive 10 120        # ping cada 10 s; reinicia si no hay respuesta en 120 s
persist-key
persist-tun

verb 3
